type Workspace {
  id: ID!
  name: String!
  description: String
  types: Int!
  env: Int!
  records: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  isDeleted: Boolean!
  deletedAt: DateTime
  members: [WorkspaceMember!]!
  _count: WorkspaceCount
}

type WorkspaceCount {
  models: Int
  contents: Int
}

type WorkspaceMember {
  id: ID!
  workspaceId: String!
  userId: Int!
  role: String!
  createdAt: DateTime!
  user: User!
}

input CreateWorkspaceInput {
  name: String!
  description: String
}

input UpdateWorkspaceInput {
  name: String
  description: String
}

type WorkspaceInvitation {
  id: ID!
  workspaceId: String!
  email: String!
  role: String!
  token: String!
  status: String!
  expiresAt: DateTime!
  createdAt: DateTime!
  workspace: Workspace!
  inviter: User!
}

type Query {
  getWorkspaces: [Workspace!]!
  getWorkspace(id: ID!): Workspace
  getInvitationDetails(token: String!): WorkspaceInvitation
  getMyPendingInvitations: [WorkspaceInvitation!]!
}

type Mutation {
  createWorkspace(input: CreateWorkspaceInput!): Workspace!
  updateWorkspace(id: ID!, input: UpdateWorkspaceInput!): Workspace!
  deleteWorkspace(id: ID!): Boolean!
  inviteMember(workspaceId: ID!, email: String!, role: String!): Boolean!
  acceptInvitation(token: String!): Boolean!
  declineInvitation(id: ID!): Boolean!
}
