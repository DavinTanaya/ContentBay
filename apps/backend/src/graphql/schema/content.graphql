type Content {
  id: ID!
  workspaceId: String!
  contentModelId: String!
  data: JSON!
  status: String!
  createdAt: String!
  updatedAt: String!
  contentModel: ContentModel
}

input CreateContentInput {
  workspaceId: String!
  contentModelId: String!
  data: JSON!
  status: String
}

input UpdateContentInput {
  id: ID!
  data: JSON!
  status: String
}

extend type Query {
  getContents(workspaceId: String!, contentModelId: String): [Content!]!
  getContent(id: ID!): Content
  deliveryGetContents(modelApiId: String!): [Content!]!
  deliveryGetContent(modelApiId: String!, entryId: ID!): Content
}

extend type Mutation {
  createContent(input: CreateContentInput!): Content!
  updateContent(input: UpdateContentInput!): Content!
  deleteContent(id: ID!): Boolean!
}
